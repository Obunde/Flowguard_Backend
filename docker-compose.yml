# Local/dev stack: Postgres + a one-shot migration runner + the API.
# `db` uses TCP + password auth (see .env.example's note on TCP vs Unix
# socket) since containers don't share the host's peer-auth setup.
#
#   docker compose up --build              # db + migrate + api
#   docker compose --profile seed run --rm seed   # seed KPC after migrate

services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-flowgard}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
      POSTGRES_DB: ${POSTGRES_DB:-flowgard}
    volumes:
      - flowgard_pgdata:/var/lib/postgresql/data
    ports:
      # Host port 5434 -> container 5432: avoids clashing with host Postgres services.
      # `api`/`migrate` talk to `db` on the internal compose network (db:5432).
      - "${POSTGRES_HOST_PORT:-5434}:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-flowgard} -d ${POSTGRES_DB:-flowgard}"]
      interval: 5s
      timeout: 5s
      retries: 10

  migrate:
    build: .
    command: ["alembic", "upgrade", "head"]
    environment: &app_env
      DATABASE_URL: postgresql+psycopg://${POSTGRES_USER:-flowgard}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB:-flowgard}
      TEST_DATABASE_URL: postgresql+psycopg://${POSTGRES_USER:-flowgard}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB:-flowgard}_test
      JWT_SECRET_KEY: ${JWT_SECRET_KEY:?set JWT_SECRET_KEY in .env}
      CORS_ALLOW_ORIGINS: http://localhost:3000,http://localhost:8501
      PLATFORM_ADMIN_EMAIL: ${PLATFORM_ADMIN_EMAIL:-platform.admin@flow.com}
      PLATFORM_ADMIN_PASSWORD: ${PLATFORM_ADMIN_PASSWORD:?set PLATFORM_ADMIN_PASSWORD in .env}
      PLATFORM_ADMIN_FULL_NAME: ${PLATFORM_ADMIN_FULL_NAME:-Platform Administrator}
    depends_on:
      db:
        condition: service_healthy

  api:
    build: .
    restart: unless-stopped
    ports:
      - "8000:8000"
    environment: *app_env
    depends_on:
      db:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    restart: unless-stopped
    ports:
      - "3000:3000"
    environment:
      BACKEND_URL: http://api:8000
    depends_on:
      api:
        condition: service_started

  seed:
    build: .
    command: ["sh", "-c", "python scripts/seed_platform_admin.py && python scripts/seed_kpc_tenant.py && python scripts/seed_uat_users.py && python scripts/seed_uat_data.py"]
    environment:
      <<: *app_env
      # Demo account passwords come from .env only; an unset one is skipped.
      SEED_ADMIN_PASSWORD: ${SEED_ADMIN_PASSWORD:-}
      SEED_PLANNER_PASSWORD: ${SEED_PLANNER_PASSWORD:-}
      SEED_TECHNICIAN_PASSWORD: ${SEED_TECHNICIAN_PASSWORD:-}
      SEED_VIEWER_PASSWORD: ${SEED_VIEWER_PASSWORD:-}
    depends_on:
      db:
        condition: service_healthy
    profiles: [seed]

volumes:
  flowgard_pgdata:
