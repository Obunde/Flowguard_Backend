# Local/dev stack: Postgres + a one-shot migration runner + the API.
# `db` uses TCP + password auth (see .env.example's note on TCP vs Unix
# socket) since containers don't share the host's peer-auth setup.
#
#   docker compose up --build              # db + migrate + api
#   docker compose --profile seed run --rm seed   # seed KPC after migrate

services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: flowgard
      POSTGRES_PASSWORD: flowgard
      POSTGRES_DB: flowgard
    volumes:
      - flowgard_pgdata:/var/lib/postgresql/data
    ports:
      # Host 5433 -> container 5432: avoids clashing with a Postgres already
      # running natively on the host's 5432. `api`/`migrate` talk to `db` on
      # the compose network directly and don't use this mapping at all;
      # it's only for connecting a host-side psql/GUI client.
      - "5433:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U flowgard -d flowgard"]
      interval: 5s
      timeout: 5s
      retries: 10

  migrate:
    build: .
    command: ["alembic", "upgrade", "head"]
    environment: &app_env
      DATABASE_URL: postgresql+psycopg://flowgard:flowgard@db:5432/flowgard
      TEST_DATABASE_URL: postgresql+psycopg://flowgard:flowgard@db:5432/flowgard_test
      JWT_SECRET_KEY: ${JWT_SECRET_KEY:-dev-secret-change-me}
      CORS_ALLOW_ORIGINS: http://localhost:3000
    depends_on:
      db:
        condition: service_healthy

  api:
    build: .
    restart: unless-stopped
    ports:
      - "8000:8000"
    environment: *app_env
    depends_on:
      db:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully

  seed:
    build: .
    command: ["python", "scripts/seed_kpc_tenant.py"]
    environment: *app_env
    depends_on:
      db:
        condition: service_healthy
    profiles: [seed]

volumes:
  flowgard_pgdata:
